<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fatura de internet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#eef1f6; --fundo2:#e3e7ee; --cartao:#ffffff; --tinta:#0f172a; --suave:#64748b;
    --linha:#e5e9f0; --campo:#f5f7fa;
    --verde1:#10b981; --verde2:#047857;
    --azul1:#0ea5e9; --azul2:#0369a1;
    --roxo1:#7c3aed; --roxo2:#5b21b6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--tinta);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--fundo);
    min-height:100vh; line-height:1.5;
  }
  .topo{
    background:rgba(255,255,255,.92); border-bottom:1px solid var(--linha);
    padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .avatar{
    width:44px; height:44px; flex:none; border-radius:12px; background:#d9dde3; border:1px solid #b9bfc9;
    display:grid; place-items:center; font-weight:700; font-size:15px;
  }
  .quem{flex:1 1 190px; min-width:0}
  .quem b{display:block; font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .quem span{font-size:13px; color:var(--suave)}
  .pilula{
    font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px;
    border:1px solid var(--linha); background:#f8fafc; white-space:nowrap;
  }
  main{max-width:1120px; margin:0 auto; padding:28px 16px 40px}
  .sobre{font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--suave); margin:0 0 10px}
  h1{font-size:clamp(26px,6vw,32px); font-weight:800; letter-spacing:-.02em; margin:0 0 10px; line-height:1.15}
  .intro{color:#475569; margin:0 0 22px; max-width:60ch}
  .grade{display:grid; gap:22px; grid-template-columns:1fr}
  @media (min-width:860px){
    .topo{padding:16px 32px}
    main{padding:40px 32px 56px}
    .grade{grid-template-columns:1fr 1fr; gap:26px}
  }
  .cartao{
    background:var(--cartao); border-radius:26px; padding:0 20px 20px;
    box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.06);
    display:flex; flex-direction:column;
  }
  .faixa{
    border-radius:20px; color:#fff; padding:18px; display:flex; align-items:center; gap:14px;
    margin-bottom:22px; box-shadow:0 8px 18px rgba(15,23,42,.14);
  }
  .faixa .ico{width:42px; height:42px; flex:none; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center}
  .faixa svg{width:20px; height:20px}
  .faixa b{display:block; font-size:16px; font-weight:800; letter-spacing:-.01em}
  .faixa span{font-size:13px; opacity:.92}
  .preta{background:#000}
  .verde{background:linear-gradient(120deg,var(--verde1),var(--verde2))}
  .azul{background:linear-gradient(120deg,var(--azul1),var(--azul2))}
  .roxa{background:linear-gradient(120deg,var(--roxo1),var(--roxo2))}
  .cartao h2{font-size:18px; font-weight:700; margin:0 4px 6px; letter-spacing:-.01em}
  .cartao p{margin:0 4px 16px; color:var(--suave); font-size:15px}
  .valor{font-size:40px; font-weight:800; letter-spacing:-.03em; margin:0 4px 4px; line-height:1.1}
  .dados{display:grid; grid-template-columns:1fr 1fr; gap:16px 12px; margin:6px 4px 18px}
  .dados dt{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--suave); margin-bottom:3px}
  .dados dd{margin:0; font-weight:700; font-size:15px; overflow-wrap:anywhere}
  .dados .larga{grid-column:1/-1}
  .nota{border-top:1px solid var(--linha); margin:auto 0 0; padding:14px 4px 0; font-size:13px; color:var(--suave)}
  .nota strong{color:var(--tinta); font-weight:700}
  .qr{align-self:center; width:200px; height:200px; padding:10px; background:#fff; border:1px solid var(--linha); border-radius:16px; margin:0 0 16px}
  .qr img{width:100%; height:100%; display:block; image-rendering:pixelated}
  .codigo{
    background:var(--campo); border:1px solid var(--linha); border-radius:14px; padding:12px 14px; margin:0 0 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.55;
    overflow-wrap:anywhere; word-break:break-all; color:#1e293b; user-select:all;
  }
  .codigo.linha{font-size:15px; font-weight:600; word-break:normal; letter-spacing:.01em}
  .botoes{display:flex; flex-direction:column; gap:10px; margin-top:auto}
  .btn{
    font:inherit; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; text-align:center;
    border-radius:14px; padding:14px 18px; min-height:50px; border:1px solid transparent;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s,transform .05s;
  }
  .btn:active{transform:scale(.99)}
  .btn:focus-visible,a:focus-visible{outline:3px solid #0ea5e9; outline-offset:2px}
  .b-verde{background:var(--verde2); color:#fff}
  .b-verde:hover{background:#036a4b}
  .b-azul{background:var(--azul2); color:#fff}
  .b-azul:hover{background:#075985}
  .b-roxo{background:var(--roxo2); color:#fff}
  .b-roxo:hover{background:#4c1d95}
  .b-claro{background:#fff; color:var(--tinta); border-color:var(--linha)}
  .b-claro:hover{background:#f8fafc}
  .btn.ok{background:#0f172a; color:#fff}
  .btn svg{width:18px; height:18px; flex:none}
  footer{text-align:center; color:var(--suave); font-size:13px; margin-top:30px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}

  .tranca{max-width:440px; margin:0 auto; padding:48px 16px}
  .tranca label{display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--suave); margin:0 4px 8px}
  .tranca input{
    width:100%; font:inherit; font-size:28px; font-weight:800; letter-spacing:.5em; text-align:center; padding:14px 0 14px .5em;
    border:1px solid var(--linha); border-radius:14px; background:var(--campo); color:var(--tinta); margin-bottom:14px;
  }
  .tranca input:focus{outline:3px solid #0ea5e9; outline-offset:2px}
  .b-preto{background:#000; color:#fff}
  .b-preto:hover{background:#1e293b}
  .btn[disabled]{opacity:.6; cursor:wait}
  .erro{color:#b91c1c; font-size:14px; font-weight:600; margin:12px 4px 0; min-height:1.5em}

  .logo{display:block; height:44px; width:auto}
  .marca{flex:0 0 100%; display:flex; justify-content:center; padding:2px 0 12px; border-bottom:1px solid var(--linha); margin-bottom:2px}
  .tranca .logo{height:64px; margin:0 auto 26px}
  @media (min-width:860px){
    .marca{flex:none; padding:0 18px 0 0; margin:0 6px 0 0; border-bottom:0; border-right:1px solid var(--linha)}
  }
</style>
</head>

  function bytes(t){ var x=atob(t), u=new Uint8Array(x.length); for(var i=0;i<x.length;i++) u[i]=x.charCodeAt(i); return u; }

  var form=document.getElementById('form'), cod=document.getElementById('cod'),
      erro=document.getElementById('erro'), entrar=document.getElementById('entrar');
  cod.addEventListener('input',function(){ cod.value=cod.value.replace(/\D/g,''); erro.textContent=''; });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(cod.value.length!==3){ erro.textContent='Digite os 3 primeiros dígitos do CPF.'; return; }
    if(!(window.crypto && crypto.subtle)){ erro.textContent='Não foi possível abrir neste navegador. Tente pelo Chrome ou Safari.'; return; }
    entrar.disabled=true; entrar.textContent='Abrindo…';
    crypto.subtle.importKey('raw',new TextEncoder().encode(cod.value),'PBKDF2',false,['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(DADOS.s),iterations:DADOS.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']); })
    .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(DADOS.i)},k,bytes(DADOS.c)); })
    .then(function(claro){ abrir(JSON.parse(new TextDecoder().decode(claro))); })
    .catch(function(){
      entrar.disabled=false; entrar.textContent='Ver fatura';
      erro.textContent='Código incorreto. Confira os 3 primeiros dígitos do CPF do titular.';
      cod.value=''; cod.focus();
    });
  });

  function copiar(texto){
    if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(texto); }
    return new Promise(function(ok,falha){
      var t=document.createElement('textarea'); t.value=texto; t.setAttribute('readonly','');
      t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy') ? ok() : falha(); }catch(e){ falha(e); }
      document.body.removeChild(t);
    });
  }

  function abrir(d){
    document.getElementById('conteudo').innerHTML=d.html;
    document.title='Fatura de internet · vencimento 07/10/2026';
    window.scrollTo(0,0);
    document.querySelectorAll('[data-copiar]').forEach(function(b){
      b.addEventListener('click',function(){
        var texto=b.dataset.limpo || document.getElementById(b.dataset.copiar).textContent.trim();
        copiar(texto).then(function(){
          b.textContent='Código copiado'; b.classList.add('ok');
          setTimeout(function(){ b.textContent=b.dataset.rotulo; b.classList.remove('ok'); },2500);
        }).catch(function(){
          b.textContent='Toque no código acima para selecionar e copiar';
          setTimeout(function(){ b.textContent=b.dataset.rotulo; },4000);
        });
      });
    });
    document.getElementById('baixar').addEventListener('click',function(){
      var url=URL.createObjectURL(new Blob([bytes(d.pdf)],{type:'application/pdf'}));
      var a=document.createElement('a'); a.href=url; a.download='boleto-07-10-2026.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },10000);
    });
  }
})();
